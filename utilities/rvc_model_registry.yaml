# =============================================================================
# RVC Model Registry
# =============================================================================
# This is the master list of RVC (Retrieval-based Voice Conversion) models
# for the deepfake audio detection pipeline.
#
# Purpose: Provide diverse synthetic voice sources for training/testing.
# Target: ~15 functional models covering varied vocal characteristics.
#
# Usage:
#   - For local testing: Use `utilities/download_rvc_models.py` (downloads MODELS dict).
#   - For supercomputer/batch: Load this YAML and iterate over the `models` list.
#
# Status Legend:
#   - verified: Confirmed working (tested download + extraction).
#   - untested: Link found, not yet verified.
#   - broken: Known to fail (404, private, DMCA, etc.).
# =============================================================================

