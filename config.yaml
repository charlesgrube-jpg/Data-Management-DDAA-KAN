# ============================================================
# Dataset Pipeline Configuration
# ============================================================
# All parameters centralized here. Set seed for reproducibility.

# --- Dataset Source ---
source:
  dataset_name: "mozilla-foundation/common_voice_13_0"
  language: "en"
  split: "train"  # Use train.tsv
  max_samples: 5  # Use up to 5 of the available clips
  cache_dir: "./cache"
  streaming: true   # Stream data to avoid downloading 80GB+
  data_path: "mozilla_cv_data/cv-corpus-24.0-2025-12-05/en" # Default path, override in Colab

# --- Audio Processing ---
audio:
  target_sr: 22050
  normalize_db: -20.0
  silence_threshold_db: 60.0 # Positive dB for librosa top_db (keep 60dB range)
  min_duration: 1.0
  max_duration: 15.0

# --- Segmentation ---
segmentation:
  chunk_duration: 5.0
  overlap: 0.0 # No overlap for cleaner dataset
  pad_last_chunk: true

# --- Synthesis ---
synthesis:
  # --- Voice Disjoint Strategy (V3) ---
  # Deprecated: tts_models (Use voice_pools instead)
  voice_pools:
    train:
      - "edge-tts:en-US-GuyNeural"
      - "edge-tts:en-US-JennyNeural"
      - "bark:v2/en_speaker_6"
    test:
      - "edge-tts:en-US-AriaNeural"     # Unseen Edge Voice
      - "edge-tts:en-US-ChristopherNeural"
      - "bark:v2/en_speaker_9"          # Unseen Bark Voice
    val:
      - "edge-tts:en-US-MichelleNeural"

  # Generators restricted to TRAIN only (Single-voice models)
  train_only_models:
    - "facebook/mms-tts-eng"          # MMS usually has 1 voice per lang
    - "microsoft/speecht5_tts"        # SpeechT5 (treat as augmentation)

  # --- RVC Voice Pools (Split-Partitioned) ---
  # IMPORTANT: Each pool must contain DISJOINT model paths
  vc_pools:
    train:
      - "models/rvc/TaylorSwift/model.pth"
      - "models/rvc/KanyeWest/kanyewestgraduation.pth"
      - "models/rvc/ArianaGrande/Ariana Grande.pth"
      - "models/rvc/Rihanna/Rihanna.pth"
      - "models/rvc/GokuEnglish/Goku.pth"
      - "models/rvc/Spongebob/Spongebob.pth"
    test:
      - "models/rvc/Biden/biden.pth"
      - "models/rvc/Trump/trump.pth"
      - "models/rvc/Adele/adelemodel.pth"
      - "models/rvc/Shakira/Shakira (Classic Era).pth"
      - "models/rvc/HomerSimpson/Homer Simpson.pth" 
    val:
      - "models/rvc/EdSheeran/Ed Sheeran.pth"
      - "models/rvc/Obama/obama.pth"
      - "models/rvc/KatyPerry/Katy Perry.pth"
      - "models/rvc/Vegeta/Vegeta.pth"

  vc_models: []   # DEPRECATED: Use vc_pools instead
  enable_vc: false    # MASTER SWITCH: Set to false to strictly bypass RVC/OpenVoice
  vc_device: "cuda:0" # Change to "cpu" if no GPU
  pick_strategy: "balanced_subset" # New strategy for pool-based selection
  fallback_on_error: false # STRICT MODE: Fail if generation fails (prevents bad labels)

  huggingface_models:         # New: Hugging Face Generators
    - name: "suno/bark"       # Codec Flavor
      enabled: true
    - name: "microsoft/speecht5_tts" # Vocoder Flavor
      enabled: true
    - name: "facebook/mms-tts-eng"   # Flow/VITS Flavor
      enabled: true

# --- Channel Effects ---
effects:
  enabled: false # Disable effects for clean verifiable test
  quality_distribution:
    clean: 0.40              # No degradation
    mobile: 0.40             # Light compression + mild noise
    noisy: 0.20              # Background noise + reverb
  apply_same_to_pair: true   # Same effect tier to real + synthetic

# --- Codec Compression ---
codec_compression:
  enabled: true  # Enabled: will skip gracefully if ffmpeg not found locally
  apply_to: "all"            # "all", "synthetic_only", "none"
  codec_distribution:
    none: 0.30               # No codec compression (30%)
    mp3_64k: 0.20            # Voice message quality (20%)
    opus_48k: 0.20           # VoIP quality - WhatsApp, Discord (20%)
    aac_96k: 0.15            # Medium streaming quality (15%)
    aac_128k: 0.15           # High streaming - YouTube, social (15%)
  apply_after_effects: true  # Apply codec after channel effects

# --- Data Splits ---
splits:
  train: 0.70
  val: 0.15
  test: 0.15

# --- Output ---
output:
  base_dir: "./processed_dataset"
  audio_format: "wav"
  metadata_file: "metadata.csv"
  save_transcripts: true

# --- Reproducibility ---
seed: 42                     # Set to null for random

# --- Validation ---
validation:
  check_balance: true
  balance_tolerance: 0.10    # Allow 40-60% for small datasets
  check_duplicates: false    # Disabled: real+synthetic pairs share same base
  check_speaker_leakage: true
  min_samples_per_split: 10  # Lowered for small test dataset

# --- Feature Extraction ---
external_datasets:
  elevenlabs:
    enabled: false
    repo_id: "skypro1111/elevenlabs_dataset"
    subdir: "elevenlabs"
    split: "test" # STRICT: Always Test
    # max_samples: 10 # Smoke Test Limit
  asvspoof:
    enabled: false
    repo_id: "" # Placeholder
    subdir: "asvspoof"
    split: "test"

# --- Feature Extraction ---
features:
  type: "cqt"                # "cqt" or "lfcc"
  device: "auto"             # "auto", "cpu", or "cuda"
  output_format: "pt"        # "pt" (PyTorch) or "npy" (NumPy)
  cqt:
    n_bins: 84               # 7 octaves
    hop_length: 512
    fmin: 32.7               # C1
  lfcc:
    n_lfcc: 60
    n_filters: 128
    n_fft: 512
    hop_length: 256
